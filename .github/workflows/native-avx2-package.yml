name: Package Windows x64 ISA experiment EXEs
on:
  workflow_call:
    inputs:
      artifact_id:
        required: true
        type: string
      artifact_digest:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: native-avx2-package
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/experiment/native-avx2'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: A0
            folder: A0-official-baseline
            variant: baseline
          - group: A1
            folder: A1-self-built-baseline
            variant: baseline
          - group: B
            folder: B-v3-thin-cgu16
            variant: modern
          - group: C
            folder: C-v3-thin-cgu1
            variant: modern
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 4960979f9f70fc00e673b648d8d70fda23973fc5
          path: overlay
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: can1357/oh-my-pi
          ref: b55cd1bb664d8ab46ddc77f2a34eb47555dbf1ac
          path: source
          persist-credentials: false
      - name: Download and verify exact same-run native archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          digest="${ARTIFACT_DIGEST#sha256:}"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")
          jq -e --arg name "native-avx2-v19.2.1-$GITHUB_RUN_ID" --arg id "$GITHUB_RUN_ID" --arg digest "sha256:$digest" '.expired == false and .name == $name and (.workflow_run.id|tostring) == $id and .digest == $digest' <<< "$artifact"
          archive="$RUNNER_TEMP/native-input.zip"
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$archive"
          echo "$digest  $archive" | sha256sum -c -
          mkdir native-artifacts
          unzip -q "$archive" -d native-artifacts
          rm -f "$archive"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.5'
      - name: Verify native input
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP: ${{ matrix.group }}
          FOLDER: ${{ matrix.folder }}
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = b55cd1bb664d8ab46ddc77f2a34eb47555dbf1ac
          test "$(git -C overlay rev-parse HEAD)" = 4960979f9f70fc00e673b648d8d70fda23973fc5
          (
            cd native-artifacts
            sha256sum --check SHA256SUMS.txt
            jq -e --arg sha "$GITHUB_SHA" '.source.commit == "b55cd1bb664d8ab46ddc77f2a34eb47555dbf1ac" and .experiment.workflow_commit == $sha' manifest.json
            file="$FOLDER/pi_natives.win32-x64-$VARIANT.node"
            test "$(jq -r --arg g "$GROUP" '.experiment.groups[$g].file' manifest.json)" = "$file"
            test "$(sha256sum "$file" | cut -d' ' -f1)" = "$(jq -r --arg g "$GROUP" '.experiment.groups[$g].sha256' manifest.json)"
          )
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        if: matrix.group == 'A0'
        with:
          node-version: '24'
      - name: Independently reverify official A0 on the separate packaging runner
        if: matrix.group == 'A0'
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.17.0 --ignore-scripts --registry=https://registry.npmjs.org
          root="$PWD"
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          export npm_config_registry=https://registry.npmjs.org
          export npm_config_userconfig="$dir/.npmrc" npm_config_globalconfig="$dir/global.npmrc"
          (
            cd "$dir"
            node -e 'const fs=require("node:fs");const name="@oh-my-pi/pi-natives-win32-x64",version="19.2.1";fs.writeFileSync("package.json",JSON.stringify({name:"native-verification",version:"1.0.0",private:true,dependencies:{[name]:version}}));fs.mkdirSync("node_modules/"+name,{recursive:true});fs.writeFileSync("node_modules/"+name+"/package.json",JSON.stringify({name,version}));'
            npm audit signatures --json --include-attestations > audit.json
            npm pack --ignore-scripts --json '@oh-my-pi/pi-natives-win32-x64@19.2.1' > pack.json
          )
          tarball=$(jq -er '.[0].filename' "$dir/pack.json")
          [[ "$tarball" =~ ^[A-Za-z0-9._-]+\.tgz$ ]]
          python3 "$root/overlay/localization/zh-CN/verify-native.py" "$dir/$tarball" "$dir/audit.json" 19.2.1 b55cd1bb664d8ab46ddc77f2a34eb47555dbf1ac "$dir/verified"
          cmp "$dir/verified/pi_natives.win32-x64-baseline.node" native-artifacts/A0-official-baseline/pi_natives.win32-x64-baseline.node
          actual=$(sha256sum "$dir/verified/pi_natives.win32-x64-baseline.node" | cut -d' ' -f1)
          jq -e --arg hash "$actual" '.experiment.a0_verified_sha256 == $hash and .experiment.groups.A0.sha256 == $hash' native-artifacts/manifest.json
      - name: Install locked dependencies and apply identical localization
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          cp -R ../overlay/localization/zh-CN .zh-build
          bun test ./.zh-build/translate.test.ts
          bun ./.zh-build/translate.ts
          bun --cwd=packages/collab-web run gen:export-viewer --write
          bun ./.zh-build/embed-viewer.ts
          git diff --check
      - name: Install exactly one verified addon
        working-directory: source
        env:
          FOLDER: ${{ matrix.folder }}
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          set -euo pipefail
          dir=packages/natives/native
          find "$dir" -maxdepth 1 -type f -name '*.node' -delete
          file="pi_natives.win32-x64-$VARIANT.node"
          cp "../native-artifacts/$FOLDER/$file" "$dir/$file"
          test "$(find "$dir" -maxdepth 1 -name '*.node' | wc -l)" -eq 1
          cmp "../native-artifacts/$FOLDER/$file" "$dir/$file"
      - name: Package standalone EXE
        working-directory: source
        env:
          RELEASE_TARGETS: win32-x64
          GROUP: ${{ matrix.group }}
        shell: bash
        run: |
          set -euo pipefail
          bun run ci:release:build-binaries
          mkdir -p ../dist
          cp packages/coding-agent/binaries/omp-windows-x64.exe "../dist/$GROUP.exe"
          jq --arg overlay "4960979f9f70fc00e673b648d8d70fda23973fc5" '.experiment.localization_commit = $overlay' ../native-artifacts/manifest.json > "../dist/$GROUP-native-manifest.json"
          cp LICENSE "../dist/$GROUP-LICENSE"
          cp .zh-build/LICENSE-dictionary "../dist/$GROUP-LICENSE-dictionary"
          (cd ../dist && sha256sum "$GROUP.exe" > "$GROUP.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: experiment-exe-${{ matrix.group }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  smoke:
    needs: package
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: A0
            variant: baseline
          - group: A1
            variant: baseline
          - group: B
            variant: modern
          - group: C
            variant: modern
    steps:
      - name: Resolve exact package artifact from this run
        id: artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP: ${{ matrix.group }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pages = gh api --paginate "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | @json'
          if ($LASTEXITCODE -ne 0) { throw 'Artifact lookup failed' }
          $all = @($pages | ForEach-Object { $_ | ConvertFrom-Json })
          $matches = @($all | Where-Object { $_.name -eq "experiment-exe-$env:GROUP" -and -not $_.expired })
          if ($matches.Count -ne 1 -or $matches[0].digest -notmatch '^sha256:[a-f0-9]{64}$') { throw 'Expected one immutable package artifact' }
          "id=$($matches[0].id)" >> $env:GITHUB_OUTPUT
          "digest=$($matches[0].digest)" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
      - name: Validate EXE and exact loaded addon on Windows
        shell: pwsh
        env:
          GROUP: ${{ matrix.group }}
          VARIANT: ${{ matrix.variant }}
          PACKAGE_ID: ${{ steps.artifact.outputs.id }}
          PACKAGE_DIGEST: ${{ steps.artifact.outputs.digest }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedNames = @("$env:GROUP.exe","$env:GROUP-native-manifest.json","$env:GROUP-LICENSE","$env:GROUP-LICENSE-dictionary","$env:GROUP.sha256")
          $items = @(Get-ChildItem -LiteralPath $PWD -Force)
          if ($items.Count -ne $expectedNames.Count -or @($items | Where-Object { $_.PSIsContainer -or $_.Name -cnotin $expectedNames }).Count) { throw 'Unexpected package contents' }
          $exe = Join-Path $PWD "$env:GROUP.exe"
          $root = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root | Out-Null
          try {
            foreach ($key in @('HOME','USERPROFILE','LOCALAPPDATA','APPDATA','XDG_DATA_HOME','XDG_CACHE_HOME','XDG_STATE_HOME','XDG_CONFIG_HOME','PI_CODING_AGENT_DIR','PI_NATIVES_DIR','TEMP','TMP')) {
              $value = Join-Path $root $key
              New-Item -ItemType Directory -Path $value -Force | Out-Null
              [Environment]::SetEnvironmentVariable($key,$value,'Process')
            }
            $env:PI_NATIVE_VARIANT = $env:VARIANT
            $env:PI_DEBUG_STARTUP = '1'
            $copy = Join-Path $root "$env:GROUP.exe"
            Copy-Item -LiteralPath $exe -Destination $copy
            $expectedExe = ((Get-Content "$env:GROUP.sha256") -split '\s+')[0]
            if ((Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedExe) { throw "EXE hash mismatch" }
            $version = & $copy --version
            if ($LASTEXITCODE -ne 0 -or "$version" -notmatch '(?<![\d.])19\.2\.1(?![\d.])') { throw "Wrong EXE version: $version" }
            $help = & $copy --help | Out-String
            if ($LASTEXITCODE -ne 0 -or $help -notmatch '用法' -or $help -notmatch '要发送的消息') { throw "Chinese help validation failed" }
            $result = & $copy bash -c 'printf "native-ok\n"' 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Native shell failed: $result" }
            $log = $result | Out-String
            $markers = @([regex]::Matches($log, '(?m)^\[startup\] native:require:([^\r\n]+)\r?$'))
            $done = @([regex]::Matches($log, '(?m)^\[startup\] native:loadNative:done\r?$'))
            if ($log -notmatch 'native-ok' -or $markers.Count -ne 1 -or $done.Count -ne 1 -or $done[0].Index -le $markers[0].Index -or $markers[0].Groups[1].Value -ne "pi_natives.win32-x64-$env:VARIANT.node") { throw "Unexpected native loader output: $log" }
            $addons = @(Get-ChildItem -LiteralPath $env:PI_NATIVES_DIR -Recurse -Filter '*.node' -File)
            if ($addons.Count -ne 1 -or $addons[0].Name -ne "pi_natives.win32-x64-$env:VARIANT.node") { throw "Expected exactly one extracted addon of the correct variant" }
            $manifest = Get-Content -Raw "$env:GROUP-native-manifest.json" | ConvertFrom-Json -AsHashtable
            $hash = (Get-FileHash -LiteralPath $addons[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $manifest.experiment.groups[$env:GROUP].sha256) { throw "Loaded addon hash mismatch" }
            $files = [ordered]@{}
            foreach ($name in $expectedNames) { $files[$name] = (Get-FileHash -LiteralPath (Join-Path $PWD $name) -Algorithm SHA256).Hash.ToLowerInvariant() }
            if ($files["$env:GROUP.exe"] -ne $expectedExe) { throw 'EXE changed after smoke' }
            $receipt = [ordered]@{group=$env:GROUP;runId=$env:GITHUB_RUN_ID;sourceSha=$env:GITHUB_SHA;artifactId=$env:PACKAGE_ID;artifactDigest=$env:PACKAGE_DIGEST;files=$files;loadedAddonSha256=$hash}
            $receipt | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $PWD "smoke-receipt.json") -Encoding utf8NoBOM
            Write-Host "Verified exact $env:GROUP native addon: $hash"
          } finally {
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smoke-receipt-${{ matrix.group }}
          path: smoke-receipt.json
          if-no-files-found: error
          retention-days: 30
  collect:
    needs: [package, smoke]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Collect exactly the four smoke-accepted packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/native-avx2/collect-verified.py
      - name: Attest verified EXE checksums and native manifests
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            dist/A0.exe
            dist/A1.exe
            dist/B.exe
            dist/C.exe
            dist/A0-native-manifest.json
            dist/A1-native-manifest.json
            dist/B-native-manifest.json
            dist/C-native-manifest.json
            dist/SHA256SUMS.txt
            dist/smoke-receipts.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: OMP-AVX2-four-verified-EXEs
          path: dist/
          if-no-files-found: error
          retention-days: 30
