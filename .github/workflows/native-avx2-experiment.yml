name: Windows x64 native ISA experiment

on:
  workflow_dispatch:
  push:
    branches: [experiment/native-avx2]
    paths:
      - 'scripts/native-avx2/**'
      - '.github/workflows/native-avx2-experiment.yml'

permissions:
  contents: read

concurrency:
  group: native-avx2-experiment
  cancel-in-progress: false

jobs:
  build:
    name: Build A0 / A1 / B / C (Windows x64)
    if: github.ref == 'refs/heads/experiment/native-avx2'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out exact upstream source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: can1357/oh-my-pi
          ref: v19.2.1
          path: upstream-source
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.5'

      - name: Install Bazelisk and prepare local cache
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bazelisk >/dev/null; then
            npm install --global @bazel/bazelisk
          fi
          mkdir -p "$HOME/.cache/omp-avx2-disk"
          printf 'common --disk_cache=%s\n' "$HOME/.cache/omp-avx2-disk" > "$RUNNER_TEMP/omp-avx2.bazelrc"
          df -h
          free -h

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cache/omp-avx2-disk
            ~/.cargo/registry
            ~/.cargo/git
          key: native-avx2-v19.2.1-linux-v1

      - name: Verify runner and source pin
        shell: bash
        env:
          OMP_SOURCE_DIR: ${{ github.workspace }}/upstream-source
        run: |
          set -euo pipefail
          test "$(git -C "$OMP_SOURCE_DIR" rev-parse HEAD)" = "b55cd1bb664d8ab46ddc77f2a34eb47555dbf1ac"
          test "$(node -p "require('$OMP_SOURCE_DIR/packages/natives/package.json').version")" = "19.2.1"
          command -v bun
          command -v bazelisk
          command -v npm
          echo "upstream source: $(git -C "$OMP_SOURCE_DIR" rev-parse HEAD)"
          echo "bun: $(bun --version)"
          echo "bazelisk: $(bazelisk --version)"
          echo "runner VMON_CI: ${VMON_CI:-unset}"

      - name: Build the four experiment groups
        shell: bash
        env:
          OMP_SOURCE_DIR: ${{ github.workspace }}/upstream-source
          OMP_BAZEL_RC: ${{ runner.temp }}/omp-avx2.bazelrc
        run: |
          set -euo pipefail
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then
            ulimit -Sn 65536 || true
          fi
          bash scripts/native-avx2/build.sh

      - name: Upload native addons and audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v8.0.1
        with:
          name: native-avx2-v19.2.1-${{ github.run_id }}
          path: native-avx2-artifacts/
          if-no-files-found: error
          retention-days: 30
