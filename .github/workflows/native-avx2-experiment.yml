name: Windows x64 native ISA experiment

on:
  workflow_dispatch:
    inputs:
      trace:
        description: Collect actual compiler subprocess evidence (fresh builds)
        type: boolean
        default: true
      recover_smoke:
        description: 'Recover only the exact four packages from run 45921779633 (no rebuild)'
        type: boolean
        default: false
  push:
    branches: [experiment/native-avx2]
    paths:
      - 'scripts/native-avx2/rebuild-request.txt'

permissions:
  contents: read

concurrency:
  group: native-avx2-experiment
  cancel-in-progress: false

jobs:
  build:
    name: Build A0 / A1 / B / C (Windows x64)
    if: github.ref == 'refs/heads/experiment/native-avx2' && !inputs.recover_smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      OMP_NATIVE_TRACE: ${{ github.event_name == 'push' || inputs.trace }}
    outputs:
      artifact_id: ${{ steps.native_upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.native_upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check out exact upstream source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: can1357/oh-my-pi
          ref: b55cd1bb664d8ab46ddc77f2a34eb47555dbf1ac
          path: upstream-source
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.5'

      - name: Check out independently verified A0 policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ac1616560eb7d04d2a58afe97dcec88f310a1ad8
          path: verification-overlay
          sparse-checkout: localization/zh-CN
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Pin npm verifier
        run: npm install -g npm@11.17.0 --ignore-scripts --registry=https://registry.npmjs.org

      - name: Install Bazelisk and prepare local cache
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/pinned-bazelisk"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 https://github.com/bazelbuild/bazelisk/releases/download/v1.30.0/bazelisk-linux-amd64 -o "$install_dir/bazelisk"
          echo "a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8  $install_dir/bazelisk" | sha256sum -c -
          chmod +x "$install_dir/bazelisk"
          echo "$install_dir" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.cache/omp-avx2-disk"
          printf 'common --disk_cache=%s\n' "$HOME/.cache/omp-avx2-disk" > "$RUNNER_TEMP/omp-avx2.bazelrc"
          df -h
          free -h

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cache/omp-avx2-disk
            ~/.cargo/registry
            ~/.cargo/git
          key: native-avx2-v19.2.1-linux-v1

      - name: Verify runner and source pin
        shell: bash
        env:
          OMP_SOURCE_DIR: ${{ github.workspace }}/upstream-source
        run: |
          set -euo pipefail
          test "$(git -C "$OMP_SOURCE_DIR" rev-parse HEAD)" = "b55cd1bb664d8ab46ddc77f2a34eb47555dbf1ac"
          test "$(node -p 'require(process.argv[1]).version' "$OMP_SOURCE_DIR/packages/natives/package.json")" = "19.2.1"
          command -v bun
          command -v bazelisk
          command -v npm
          echo "upstream source: $(git -C "$OMP_SOURCE_DIR" rev-parse HEAD)"
          echo "bun: $(bun --version)"
          echo "bazelisk: $(bazelisk --version)"
          echo "runner VMON_CI: ${VMON_CI:-unset}"

      - name: Prepare compiler trace utility
        if: env.OMP_NATIVE_TRACE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v strace >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends strace
          fi
          strace --version

      - name: Build the four experiment groups
        shell: bash
        env:
          OMP_SOURCE_DIR: ${{ github.workspace }}/upstream-source
          OMP_BAZEL_RC: ${{ runner.temp }}/omp-avx2.bazelrc
          OMP_NATIVE_VERIFY_SCRIPT: ${{ github.workspace }}/verification-overlay/localization/zh-CN/verify-native.py
        run: |
          set -euo pipefail
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then
            ulimit -Sn 65536 || true
          fi
          bash scripts/native-avx2/build.sh

      - name: Upload native addons and audit evidence
        id: native_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v8.0.1
        with:
          name: native-avx2-v19.2.1-${{ github.run_id }}
          path: native-avx2-artifacts/
          if-no-files-found: error
          retention-days: 30


  package:
    needs: build
    if: needs.build.result == 'success'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/native-avx2-package.yml
    with:
      artifact_id: ${{ needs.build.outputs.artifact_id }}
      artifact_digest: ${{ needs.build.outputs.artifact_digest }}

  recover-smoke:
    if: github.ref == 'refs/heads/experiment/native-avx2' && github.event_name == 'workflow_dispatch' && inputs.recover_smoke
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/native-avx2-package.yml
    with:
      recover_smoke: true
