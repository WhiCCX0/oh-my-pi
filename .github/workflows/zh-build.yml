name: Build and verify Chinese Windows overlay
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      sha:
        required: true
        type: string
      bun:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: overlay
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: can1357/oh-my-pi
          ref: ${{ inputs.sha }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ inputs.bun }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Pin npm verifier
        run: npm install -g npm@11.17.0 --ignore-scripts --registry=https://registry.npmjs.org
      - name: Install locked upstream dependencies
        working-directory: source
        run: bun install --frozen-lockfile
      - name: Test and apply localization
        working-directory: source
        shell: bash
        env:
          OMP_ZH_SMOKE_DICTIONARY_OUT: ${{ runner.temp }}/zh-smoke-dictionary.json
        run: |
          set -euo pipefail
          cp -R ../overlay/localization/zh-CN .zh-build
          bun test ./.zh-build/translate.test.ts
          bun ./.zh-build/translate.ts
          git diff --check
      - name: Verify and install matching upstream native addon
        working-directory: source
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          export npm_config_registry=https://registry.npmjs.org
          export npm_config_userconfig="$dir/.npmrc"
          export npm_config_globalconfig="$dir/global.npmrc"
          package="@oh-my-pi/pi-natives-win32-x64@$VERSION"
          (
            cd "$dir"
            # audit signatures loads the actual metadata tree, not only a lockfile.
            # Construct the one trusted dependency descriptor without unpacking any code.
            node -e '
              const fs = require("node:fs");
              const name = "@oh-my-pi/pi-natives-win32-x64";
              const version = process.argv[1];
              if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("Invalid native version");
              fs.writeFileSync("package.json", JSON.stringify({
                name: "native-verification", version: "1.0.0", private: true, dependencies: {[name]: version}
              }));
              fs.mkdirSync("node_modules/" + name, {recursive: true});
              fs.writeFileSync("node_modules/" + name + "/package.json", JSON.stringify({name, version}));
            ' "$VERSION"
            npm audit signatures --json --include-attestations > audit.json
            npm pack --ignore-scripts --json "$package" > pack.json
          )
          tarball=$(jq -er '.[0].filename' "$dir/pack.json")
          [[ "$tarball" =~ ^[A-Za-z0-9._-]+\.tgz$ ]]
          python3 .zh-build/verify-native.py "$dir/$tarball" "$dir/audit.json" "$VERSION" "$SOURCE_SHA" "$dir/verified"
          find packages/natives/native -maxdepth 1 -type f -name '*.node' -delete
          cp "$dir/verified/"*.node packages/natives/native/
          cp "$dir/verified/THIRD-PARTY-NOTICES.txt" packages/natives/native/
      - name: Regenerate localized export viewer manifest
        working-directory: source
        run: |
          bun --cwd=packages/collab-web run gen:export-viewer --write
          bun ./.zh-build/embed-viewer.ts
          git diff --check
      - name: Build standalone binary
        working-directory: source
        env:
          RELEASE_TARGETS: win32-x64
        run: bun run ci:release:build-binaries
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-win32-x64
          path: source/packages/coding-agent/binaries/omp-windows-x64.exe
          if-no-files-found: error
      - name: Upload full dictionary for independent Windows coverage check
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zh-smoke-dictionary
          path: ${{ runner.temp }}/zh-smoke-dictionary.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload native license notices for this target
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-notices-win32-x64
          path: source/packages/natives/native/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
  smoke:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-win32-x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: zh-smoke-dictionary
          path: verification
      - name: Verify compiled version and Chinese help
        shell: bash
        env:
          ASSET: omp-windows-x64.exe
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          chmod +x "$ASSET"
          runtime_dir=$(mktemp -d)
          export HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg"
          mkdir -p "$HOME" "$XDG_DATA_HOME"
          export USERPROFILE="$(cygpath -w "$HOME")" LOCALAPPDATA="$(cygpath -w "$runtime_dir/local")"
          mkdir -p "$runtime_dir/local"
          actual=$("./$ASSET" --version | tr -d "\r")
          [[ "$actual" == "$VERSION" || "$actual" == "v$VERSION" || "$actual" == "omp $VERSION" || "$actual" == "omp/$VERSION" ]]
          "./$ASSET" --help > help.txt
          grep -F '用法' help.txt
          grep -F '要发送的消息' help.txt
          "./$ASSET" update --check > update.txt 2>&1
          grep -F "https://github.com/WhiCCX0/oh-my-pi/releases" update.txt
          test -s verification/zh-smoke-dictionary.json
          export OMP_ZH_SMOKE_DICTIONARY="$(cygpath -w "$PWD/verification/zh-smoke-dictionary.json")"
          "./$ASSET" --smoke-test | tee smoke.txt
          grep -F "settings-dictionary-smoke:" smoke.txt
          grep -F "localization-smoke: ok" smoke.txt
      - name: Exercise real CLI HTML export and decode session payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'omp-windows-x64.exe'
          $root = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root | Out-Null
          try {
            foreach ($key in @('HOME','USERPROFILE','LOCALAPPDATA','APPDATA','XDG_DATA_HOME','XDG_CACHE_HOME','XDG_STATE_HOME','XDG_CONFIG_HOME','PI_CODING_AGENT_DIR','PI_NATIVES_DIR')) {
              $value = Join-Path $root $key
              New-Item -ItemType Directory -Path $value | Out-Null
              [Environment]::SetEnvironmentVariable($key,$value,'Process')
            }
            $session = Join-Path $root 'fixture.jsonl'
            $output = Join-Path $root 'fixture.html'
            $header = @{type='session';version=3;id=([guid]::NewGuid().ToString());timestamp=[DateTimeOffset]::UtcNow.ToString('o');cwd=$root}
            $marker = '汉化导出验证'
            $message = @{type='message';id='12345678';parentId=$null;timestamp=[DateTimeOffset]::UtcNow.ToString('o');message=@{role='user';content=@(@{type='text';text=$marker});timestamp=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()}}
            @((ConvertTo-Json -InputObject $header -Compress -Depth 10),(ConvertTo-Json -InputObject $message -Compress -Depth 10)) | Set-Content -LiteralPath $session -Encoding utf8
            & $exe --export $session $output
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $output -PathType Leaf)) { throw 'CLI export failed' }
            $html = Get-Content -LiteralPath $output -Raw -Encoding utf8
            if (-not $html.Contains('window.addEventListener("DOMContentLoaded",function(){') -or $html.Contains('src="https://build.stencil.so/web/omp/')) { throw 'Inline viewer not found in exported HTML' }
            $payload = [regex]::Match($html, '<script id="session-data" type="application/json">([A-Za-z0-9+/=]+)</script>')
            if (-not $payload.Success) { throw 'Session payload not found' }
            $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload.Groups[1].Value)) | ConvertFrom-Json
            if ($decoded.header.id -ne $header.id -or -not ($decoded.entries | Where-Object { $_.message.role -eq 'user' -and $_.message.content[0].text -eq $marker })) { throw 'Exported session payload mismatch' }
            Write-Host 'localization-export-smoke: ok'
          } finally {
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }
