name: 上游源码定期同步
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-sync.yml'
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    concurrency:
      group: upstream-main-sync
      cancel-in-progress: false
    steps:
      - name: Merge upstream on alternate UTC days or explicit request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # POSIX day-of-month */2 is not a uniform two-day cadence across months.
          # Use UTC epoch day parity; the daily trigger is a no-op on alternate days.
          day=$(( $(date -u +%s) / 86400 ))
          if [[ "$GITHUB_EVENT_NAME" == schedule && $((day % 2)) -ne 0 ]]; then
            echo "Alternate day: no source sync."
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main
