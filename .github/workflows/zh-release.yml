name: 中文版同步与发布
on:
  push:
    branches: [main]
    paths:
      - 'localization/zh-CN/**'
      - '!localization/zh-CN/README.md'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zh-release
  cancel-in-progress: false
env:
  ZH_REVISION: '1'
jobs:
  sync-upstream:
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.sync == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    concurrency:
      group: upstream-main-sync
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Merge upstream main without force
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      build: ${{ steps.release.outputs.build }}
      bun: ${{ steps.release.outputs.bun }}
      sync: ${{ steps.release.outputs.sync }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Test release selection
        run: python3 localization/zh-CN/release-plan.py --test
      - name: Resolve stable upstream release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream=can1357/oh-my-pi
          tag=$(gh api "repos/$upstream/releases/latest" --jq .tag_name)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run this workflow from main."
            exit 1
          fi

          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          plan=$(python3 localization/zh-CN/release-plan.py "$tag" "$ZH_REVISION" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" <<< "$releases")
          build=$(jq -r .build <<< "$plan")
          sync=$(jq -r .sync <<< "$plan")
          local_tag=$(jq -r .tag <<< "$plan")
          printf 'build=%s\nsync=%s\n' "$build" "$sync" >> "$GITHUB_OUTPUT"
          if [[ "$build" == "false" ]]; then
            echo "Stable release $tag already published; no compilation needed."
            exit 0
          fi
          refs=$(git ls-remote "https://github.com/$upstream.git" "refs/tags/$tag" "refs/tags/$tag^{}")
          sha=$(printf '%s\n' "$refs" | awk '/\^\{\}$/ { print $1; found=1 } END { if (!found) exit 1 }' || true)
          if [[ -z "$sha" ]]; then sha=$(printf '%s\n' "$refs" | awk 'NR == 1 { print $1 }'); fi
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          ci_content=$(gh api "repos/$upstream/contents/.github/workflows/ci.yml?ref=$sha" --jq .content | base64 -d)
          bun=$(printf '%s\n' "$ci_content" | sed -nE "s/^[[:space:]]*bun-version:[[:space:]]*['\"]?([0-9]+\.[0-9]+\.[0-9]+)['\"]?[[:space:]]*(#.*)?$/\1/p" | sort -u)
          bun_count=$(printf '%s\n' "$bun" | sed '/^$/d' | wc -l)
          if [[ "$bun_count" -ne 1 ]]; then
            package_json=$(gh api "repos/$upstream/contents/package.json?ref=$sha" --jq .content | base64 -d)
            bun=$(printf '%s' "$package_json" | jq -r '.packageManager // empty' | sed -nE 's/^bun@[^0-9]*([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p')
          fi
          [[ "$bun" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Could not resolve one supported Bun version from upstream CI or packageManager."
            exit 1
          }

          printf 'version=%s\nsha=%s\ntag=%s\nbun=%s\n' "${tag#v}" "$sha" "$local_tag" "$bun" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: overlay
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: can1357/oh-my-pi
          ref: ${{ needs.prepare.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ needs.prepare.outputs.bun }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Pin npm verifier
        run: npm install -g npm@11.17.0 --ignore-scripts --registry=https://registry.npmjs.org
      - name: Install locked upstream dependencies
        working-directory: source
        run: bun install --frozen-lockfile
      - name: Test and apply localization
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cp -R ../overlay/localization/zh-CN .zh-build
          bun test ./.zh-build/translate.test.ts
          bun ./.zh-build/translate.ts
          git diff --check
      - name: Verify and install matching upstream native addon
        working-directory: source
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          export npm_config_registry=https://registry.npmjs.org
          export npm_config_userconfig="$dir/.npmrc"
          export npm_config_globalconfig="$dir/global.npmrc"
          package="@oh-my-pi/pi-natives-win32-x64@$VERSION"
          (
            cd "$dir"
            printf '{"private":true,"name":"native-verification","version":"1.0.0"}\n' > package.json
            npm install --package-lock-only --force --ignore-scripts --no-audit --no-fund --save-exact "$package"
            npm audit signatures --json --include-attestations > audit.json
            npm pack --ignore-scripts --json "$package" > pack.json
          )
          tarball=$(jq -er '.[0].filename' "$dir/pack.json")
          [[ "$tarball" =~ ^[A-Za-z0-9._-]+\.tgz$ ]]
          python3 .zh-build/verify-native.py "$dir/$tarball" "$dir/audit.json" "$VERSION" "$SOURCE_SHA" "$dir/verified"
          find packages/natives/native -maxdepth 1 -type f -name '*.node' -delete
          cp "$dir/verified/"*.node packages/natives/native/
          cp "$dir/verified/THIRD-PARTY-NOTICES.txt" packages/natives/native/
      - name: Regenerate localized export viewer manifest
        working-directory: source
        run: |
          bun --cwd=packages/collab-web run gen:export-viewer --write
          bun ./.zh-build/embed-viewer.ts
          git diff --check
      - name: Build standalone binary
        working-directory: source
        env:
          RELEASE_TARGETS: win32-x64
        run: bun run ci:release:build-binaries
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-win32-x64
          path: source/packages/coding-agent/binaries/omp-windows-x64.exe
          if-no-files-found: error
      - name: Upload native license notices for this target
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-notices-win32-x64
          path: source/packages/natives/native/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
  smoke:
    needs: [prepare, build]
    if: needs.prepare.outputs.build == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-win32-x64
      - name: Verify compiled version and Chinese help
        shell: bash
        env:
          ASSET: omp-windows-x64.exe
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x "$ASSET"
          runtime_dir=$(mktemp -d)
          export HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg"
          mkdir -p "$HOME" "$XDG_DATA_HOME"
          export USERPROFILE="$(cygpath -w "$HOME")" LOCALAPPDATA="$(cygpath -w "$runtime_dir/local")"
          mkdir -p "$runtime_dir/local"
          actual=$("./$ASSET" --version | tr -d "\r")
          [[ "$actual" == "$VERSION" || "$actual" == "v$VERSION" || "$actual" == "omp $VERSION" || "$actual" == "omp/$VERSION" ]]
          "./$ASSET" --help > help.txt
          grep -F '用法' help.txt
          grep -F '要发送的消息' help.txt
          "./$ASSET" update --check > update.txt 2>&1
          grep -F "https://github.com/WhiCCX0/oh-my-pi/releases" update.txt
          "./$ASSET" --smoke-test
  publish:
    needs: [prepare, build, smoke]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-win32-x64
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-notices-win32-x64
          path: legal
      - name: Publish immutable Chinese release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          state=$(jq -c --arg tag "$TAG" '[.[][] | select(.tag_name == $tag) | {isDraft: .draft, targetCommitish: .target_commitish}] | if length > 1 then error("Duplicate release tag") else first // empty end' <<< "$releases")
          if [[ -n "$state" ]] && [[ $(jq -r .isDraft <<< "$state") == false ]]; then exit 0; fi
          if [[ -n "$state" ]] && [[ $(jq -r .targetCommitish <<< "$state") != "$GITHUB_SHA" ]]; then
            echo "::error::Existing draft targets a different overlay commit; bump ZH_REVISION or review the draft."
            exit 1
          fi
          cp LICENSE dist/LICENSE
          cp localization/zh-CN/LICENSE-dictionary dist/LICENSE-dictionary
          test -s legal/THIRD-PARTY-NOTICES.txt
          cp legal/THIRD-PARTY-NOTICES.txt dist/THIRD-PARTY-NOTICES.txt
          (cd dist && sha256sum omp-windows-x64.exe LICENSE LICENSE-dictionary THIRD-PARTY-NOTICES.txt > SHA256SUMS.txt)
          printf '上游版本：v%s\n上游提交：%s\n汉化覆盖层提交：%s\n\n界面与帮助汉化，未覆盖的文字保留英文。仅发布 Windows x64 独立二进制，已通过 Windows x64 基础烟测。请从本仓库下载更新。\n' "$VERSION" "$SOURCE_SHA" "$GITHUB_SHA" > notes.md
          if [[ -z "$state" ]]; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG 简体中文版" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/omp-windows-x64.exe dist/LICENSE dist/LICENSE-dictionary dist/THIRD-PARTY-NOTICES.txt dist/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --notes-file notes.md
